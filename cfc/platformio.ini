; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
custom_system = vertical

[env]
platform = espressif32
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv    
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 19200
upload_speed = 115200
extra_scripts = pre:fw_version.py, pre:../proto/codegen/compile.py
monitor_echo = yes
monitor_filters = esp32_exception_decoder, send_on_enter, colorize, time
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:flight-computer]
build_src_filter = -<*> +<CFC/*> +<Common.h> +<Comms.*> +<USBComms.*>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_FC 
  -D BOARD_FC_1

[env:test]
build_src_filter = -<*> +<diagnostic/*> +<Common.h>

[env:I2C-Scanner]
build_src_filter = -<*> +<tests/i2c-scanner-test/*>

[env:GPS-Test]
build_src_filter = -<*> +<tests/gps-test/*>

[env:INA233-test]
build_src_filter = -<*> +<tests/INA233-test/*>

[env:usb-comms-test]
build_src_filter = -<*> +<Comms.*> +<USBComms.*> +<tests/usb-comms-test/*>

[env:baro-test]
build_src_filter = -<*> +<tests/baro-test/*>

[env:p900-test]
build_src_filter = -<*> +<tests/p900-test/*>

[env:blackbox-test]
build_src_filter = -<*> +<Common.h> +<Comms.*> +<USBComms.*> +<tests/blackbox-test/*> 
build_flags = -D BOARD_FC -D BOARD_FC_1 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:blackbox-read-test]
build_src_filter = -<*> +<Common.h> +<Comms.*> +<tests/blackbox-read-test/*> 
build_flags = -D BOARD_FC -D BOARD_FC_1 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:temp-test]
build_src_filter = -<*> +<tests/temp-test/*>

[env:high-accel-test]
build_src_filter = -<*> +<Common.h> +<Comms.*> +<tests/high-accel-test/*>
build_flags = -D BOARD_FC -D BOARD_FC_1 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:accel-test]
build_src_filter = -<*> +<tests/accel-test/*>

[env:hello-world-test]
build_src_filter = -<*> +<Common.h> +<Comms.*>  +<tests/hello-world/*>
;build_flags = -D BOARD_FC -D BOARD_FC_1 # disables USB Serial 
